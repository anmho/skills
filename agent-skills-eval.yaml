# https://github.com/darkrishabh/agent-skills-eval
root: ./skills
workspace: ./agent-skills-workspace
baseline: true
target: deepseek-v4-flash
judge: deepseek-v4-flash
baseUrl: https://api.deepseek.com/v1
apiKeyEnv: DEEPSEEK_API_KEY
include:
  - "auth"
  - "notifications"
  - "apple-reminders"
  - "gmail-threads"
  - "bluebubbles-cli"
concurrency: 2
layout: iteration
strict: true
report:
  enabled: true
  title: anmho/skills eval report
logging:
  format: jsonl
  verbose: false
  color: false
targetParams:
  temperature: 0
judgeParams:
  temperature: 0
