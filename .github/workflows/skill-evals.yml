name: Skill evals

on:
  push:
    branches: [main]
    paths:
      - "skills/**"
      - "agent-skills-eval.yaml"
      - "scripts/**"
      - ".github/workflows/skill-evals.yml"
  pull_request:
    paths:
      - "skills/**"
      - "agent-skills-eval.yaml"
      - "scripts/**"
      - ".github/workflows/skill-evals.yml"
  workflow_dispatch:

concurrency:
  group: skill-evals-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate skill definitions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install jq
        run: sudo apt-get update -qq && sudo apt-get install -y -qq jq

      - name: Validate skills with evals
        run: scripts/validate-all-skills.sh

  eval:
    name: Run LLM evals (agent-skills-eval)
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install jq
        run: sudo apt-get update -qq && sudo apt-get install -y -qq jq

      - name: Check for OPENAI_API_KEY
        id: keycheck
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          if [[ -z "${OPENAI_API_KEY}" ]]; then
            echo "skip=true" >> "${GITHUB_OUTPUT}"
            echo "::warning::OPENAI_API_KEY not configured; skipping LLM evals"
          else
            echo "skip=false" >> "${GITHUB_OUTPUT}"
          fi

      - name: Run skill evals
        if: steps.keycheck.outputs.skip != 'true'
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: scripts/run-evals.sh

      - name: Summarize benchmark
        if: always() && steps.keycheck.outputs.skip != 'true'
        run: |
          bench="agent-skills-workspace/iteration-1/benchmark.json"
          if [[ -f "${bench}" ]]; then
            echo "## Skill eval benchmark" >> "$GITHUB_STEP_SUMMARY"
            jq '.' "${bench}" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload eval artifacts
        if: always() && steps.keycheck.outputs.skip != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: skill-evals-${{ github.run_id }}
          path: |
            agent-skills-workspace/
          if-no-files-found: ignore
          retention-days: 14

  eval-reminder:
    name: Remind to configure OPENAI_API_KEY on main
    needs: [validate, eval]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Warn if LLM evals were skipped
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          if [[ -z "${OPENAI_API_KEY}" ]]; then
            echo "::warning::OPENAI_API_KEY is not set — LLM evals are skipped. Add the secret under Settings → Secrets → Actions."
            exit 0
          fi
          echo "OPENAI_API_KEY is configured; LLM evals run on pushes that touch skills/**"
